# نشر تلقائي لنسخة ثابتة من المعرض على GitHub Pages (HTTPS مجاني وثابت).
# ما يعمل: المعرض ثلاثي الأبعاد، الواقع الافتراضي، البوصلة المهنية كاملة
# بالنسب والإحصاءات، معارض الصور، والقراءة الصوتية.
# ما يحتاج خادماً: المحادثة الحرة مع سعود عبر Groq (تعمل بالوضع المحلي).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4
